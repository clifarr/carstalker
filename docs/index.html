<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarStalker</title>
<style>
  :root { color-scheme: light dark; --bg:#fafafa; --card:#fff; --text:#1b1b1f; --muted:#5f6368; --accent:#0b6e4f; --border:#dadce0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111214; --card:#1b1c1f; --text:#e8eaed; --muted:#a9adb4; --accent:#6fd3a8; --border:#33363b; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width:560px; width:100%; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px 24px; }
  h1 { margin:0 0 6px; font-size:1.8rem; }
  p { color:var(--muted); }
  ul { padding-left:20px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>CarStalker</h1>
  <p>OBD-II diagnostics for Android. Your car, decoded.</p>
  <ul>
    <li><a href="privacy-policy.html">Privacy policy</a></li>
    <li><a href="https://github.com/clifarr/carstalker/blob/main/docs/install.md">Install and troubleshooting</a></li>
    <li><a href="https://github.com/clifarr/carstalker">Source code</a></li>
    <li><a href="https://github.com/clifarr/carstalker/releases">Releases</a></li>
  </ul>
</main>
</body>
</html>
