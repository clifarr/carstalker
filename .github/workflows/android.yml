name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintRelease --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      # No signing key in CI, so this produces an unsigned AAB for inspection.
      # Sign the release bundle locally with keystore.properties before uploading to Play.
      - name: Assemble release bundle
        run: ./gradlew :app:bundleRelease --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: carstalker-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: carstalker-release-unsigned
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
